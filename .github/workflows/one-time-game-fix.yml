name: One-time game fix

on:
  push:
    paths:
      - '.github/workflows/one-time-game-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch only the puzzle transitions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text(encoding='utf-8')
          old = "later(()=>{$('#stp').className='';show(i==6?8:i+2)},6000)};"
          new = "later(()=>{$('#stp').className='';if(i===0){show(2,true);pz(1)}else if(i===1){show(3,true);pz(2)}else if(i===2){show(4,true);pz(3)}else{show(i==6?8:i+2)}},6000)};"
          if old not in s:
              raise SystemExit('Target transition code was not found; no changes made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit main.js only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix direct puzzle transitions"
          git push
