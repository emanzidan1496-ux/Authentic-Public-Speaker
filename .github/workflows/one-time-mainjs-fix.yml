name: One-time main.js fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.js only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('main.js')
          text = path.read_text(encoding='utf-8')

          old = "{name:'الخوف من التحدث أمام الجمهور',a:['الخوف من التحدث أمام الجمهور','الخوف من الحديث أمام الجمهور','الخوف من التحدث','الخوف من الجمهور','رهبة المسرح']"
          new = "{name:'الخوف من التحدث أمام الجمهور',a:['الخوف','الخوف من التحدث أمام الجمهور','الخوف من الحديث أمام الجمهور','الخوف من التحدث','الخوف من الجمهور','رهبة المسرح']"
          if old not in text:
              raise SystemExit('Expected fear-answer block was not found')
          text = text.replace(old, new, 1)

          old = "4:()=>W(4,hall(340,'c',`<text data-a=\"sent\" class=\"hot\" x=\"500\" y=\"190\" text-anchor=\"middle\" font-size=\"30\" fill=\"#F6EFE4\" direction=\"rtl\">أنا سعيد جدًا بوجودكم اليوم.</text>`)+`<rect data-a=\"body\" class=\"hot\" x=\"280\" y=\"240\" width=\"120\" height=\"170\" fill=\"transparent\"/>${ring(340,340,85,'body')}<rect data-a=\"sent\" class=\"hot\" x=\"270\" y=\"150\" width=\"460\" height=\"60\" fill=\"transparent\"/>`),"
          new = "4:()=>W(4,hall(340,'','')) ,"
          if old not in text:
              raise SystemExit('Expected body-language scene was not found')
          text = text.replace(old, new, 1)

          old = "act.rec=()=>{if(!go('lit'))return;const c=cur();speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();say(1,1,.7);c.classList.add('w1');later(()=>{c.classList.replace('w1','w2');say(1.9,1.3,1)},2000);later(()=>{c.classList.replace('w2','w3');say(.2,.6,.5)},4000);later(()=>pz(1),6500)};"
          new = "act.rec=()=>{if(!go('lit'))return;const c=cur();speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();say(1,1,.7);c.classList.add('w1');later(()=>{c.classList.replace('w1','w2');say(1.9,1.3,1)},2000);later(()=>{c.classList.replace('w2','w3');say(.2,.6,.5)},4000);later(()=>pz(1),6500)};"
          if old not in text:
              raise SystemExit('Voice-tone block changed unexpectedly')
          text = text.replace(old, new, 1)

          old = "act.talk=()=>{if(!go('lit'))return;later(()=>cls('still'),2800);later(()=>cur().classList.remove('still'),4900);later(()=>pz(2),5800)};"
          new = "act.talk=()=>{if(!go('lit'))return;later(()=>cls('still'),2800);later(()=>cur().classList.remove('still'),4900);later(()=>pz(2),5800)};"
          if old not in text:
              raise SystemExit('Pause block changed unexpectedly')
          text = text.replace(old, new, 1)

          start = text.index('const pz=i=>{')
          end = text.index('const win=i=>{', start)
          pz = r'''const pz=i=>{
  const p=P[i],e=$('#pz');
  e.className='on p'+i;
  e.style.pointerEvents='auto';
  e.innerHTML=`<p>${p.r}</p><h3>${p.q}</h3><div><input id="in" type="text" placeholder="اكتب إجابتك" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button id="ok" type="button">تحقّق</button></div><em id="ht"></em><a id="hb">تلميح</a>`;

  const inp=e.querySelector('#in'),ok=e.querySelector('#ok'),hb=e.querySelector('#hb'),ht=e.querySelector('#ht');
  inp.style.pointerEvents='auto';
  inp.style.userSelect='text';
  inp.disabled=false;
  inp.readOnly=false;

  const chk=()=>{
    const answer=nz(inp.value);
    if(p.a.map(nz).includes(answer)){
      e.className='';
      win(i);
    }else{
      e.classList.add('no');
      setTimeout(()=>e.classList.remove('no'),450);
    }
  };

  hb.onclick=ev=>{ev.preventDefault();ev.stopPropagation();ht.textContent=p.h};
  inp.addEventListener('pointerdown',ev=>{ev.stopPropagation();inp.focus()});
  inp.addEventListener('click',ev=>{ev.stopPropagation();inp.focus()});
  inp.addEventListener('input',ev=>ev.stopPropagation());
  inp.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Enter'){ev.preventDefault();chk()}});
  ok.onclick=ev=>{ev.preventDefault();ev.stopPropagation();chk()};

  setTimeout(()=>{inp.focus();inp.select()},50);
};
'''
          text = text[:start] + pz + text[end:]

          start = text.index('const win=i=>{')
          end = text.index('const reveal=()=>{', start)
          win = r'''const win=i=>{
  cls('solved');
  if(i==3){const s=cur().querySelector('.spk');s.classList.remove('c');s.classList.add('o')}
  if(i==4)cur().tidy();
  if(i==6)cur().querySelector('.spk').classList.add('o');
  if(!files.includes(i))files.push(i);
  save();
  hud();

  $('#stp').innerHTML=`<div>تم اكتشاف الملف 0${i+1}</div><small>أُضيف إلى ملف القضية: ${P[i].name}</small>`;
  $('#stp').className='on';

  later(()=>{
    $('#stp').className='';
    if(i===0){show(2,true);pz(1)}
    else if(i===1){show(3,true);pz(2)}
    else if(i===2){show(4,true);pz(3)}
    else{show(i==6?8:i+2)}
  },1800);
};
'''
          text = text[:start] + win + text[end:]

          marker = "$('#fb').onclick=()=>$('#dr').classList.toggle('on');"
          fallback = r'''

/* ---------- puzzle keyboard fallback ---------- */
document.addEventListener('keydown',ev=>{
  const box=$('#pz'),inp=$('#in');
  if(!box||!inp||!box.classList.contains('on')||document.activeElement===inp)return;
  if(ev.key==='Backspace'){ev.preventDefault();inp.value=inp.value.slice(0,-1);inp.dispatchEvent(new Event('input',{bubbles:true}));return}
  if(ev.key==='Delete'){ev.preventDefault();inp.value='';inp.dispatchEvent(new Event('input',{bubbles:true}));return}
  if(ev.key==='Enter'){ev.preventDefault();inp.click();return}
  if(ev.key.length===1){ev.preventDefault();inp.value+=ev.key;inp.dispatchEvent(new Event('input',{bubbles:true}))}
});
'''
          if marker not in text:
              raise SystemExit('Boot marker not found')
          text = text.replace(marker, marker + fallback, 1)

          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-mainjs-fix.yml
      - name: Commit main.js and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/one-time-mainjs-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix puzzle transitions and answer input"
          git push
