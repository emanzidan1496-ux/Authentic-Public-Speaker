<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قضية المتحدث الحقيقي</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="app"></div>

  <script type="module" src="./main.js"></script>

  <script>
    /* إصلاح خانة الإجابة: قبول "الخوف" قبل فحص main.js،
       وإعادة المؤشر للخانة بعد الضغط على تحقق حتى يمكن تعديل الإجابة فورًا. */
    document.addEventListener('click', function (event) {
      const button = event.target.closest('#ok');
      const input = document.querySelector('#in');
      const puzzle = document.querySelector('#pz');
      if (!button || !input || !puzzle) return;

      const text = puzzle.textContent || '';
      const answer = (input.value || '').trim();

      /* هذا المستمع يعمل في مرحلة الالتقاط، لذلك تصل الإجابة المصححة إلى main.js قبل فحصها. */
      if (text.includes('كل متحدث عظيم قابلني') && /^(ال)?خوف$/.test(answer)) {
        input.value = 'الخوف من التحدث أمام الجمهور';
      }

      /* بعد التحقق، أبقِ خانة الإجابة قابلة للكتابة والتعديل مباشرة. */
      setTimeout(function () {
        const currentInput = document.querySelector('#in');
        const currentPuzzle = document.querySelector('#pz');
        if (currentInput && currentPuzzle && currentPuzzle.classList.contains('on')) {
          currentInput.focus();
          const n = currentInput.value.length;
          try { currentInput.setSelectionRange(n, n); } catch (e) {}
        }
      }, 30);
    }, true);
  </script>
</body>
</html>
