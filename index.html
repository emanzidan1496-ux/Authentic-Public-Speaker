<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قضية المتحدث الحقيقي</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="app"></div>

  <script type="module" src="./main.js"></script>

  <script>
    /* إصلاح إدخال الإجابات وإعادة التركيز على خانة الإجابة بعد الخطأ */
    document.addEventListener('click', function (event) {
      const button = event.target.closest('#ok');
      const input = document.querySelector('#in');
      const puzzle = document.querySelector('#pz');
      if (!button || !input || !puzzle) return;

      const text = puzzle.textContent || '';
      const answer = (input.value || '').trim();

      /* في لغز الخوف: "الخوف" إجابة صحيحة */
      if (text.includes('كل متحدث عظيم قابلني') && /^(ال)?خوف$/.test(answer)) {
        input.value = 'الخوف من التحدث أمام الجمهور';
      }

      /* بعد الضغط على تحقق، لو كانت الإجابة خاطئة نعيد المؤشر للخانة
         حتى تستطيع حذف الإجابة وتعديلها مباشرة دون الضغط مرة أخرى. */
      setTimeout(() => {
        const currentInput = document.querySelector('#in');
        const currentPuzzle = document.querySelector('#pz');
        if (currentInput && currentPuzzle && currentPuzzle.classList.contains('on')) {
          currentInput.focus();
          const n = currentInput.value.length;
          try { currentInput.setSelectionRange(n, n); } catch (e) {}
        }
      }, 20);
    });
  </script>
</body>
</html>
