<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قضية المتحدث الحقيقي</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"></div>

  <script>
    /* عند عمل Refresh تبدأ اللعبة من السؤال الأول بدل استكمال آخر سؤال. */
    try { localStorage.removeItem('asc-001'); } catch (e) {}
  </script>

  <script type="module" src="./main.js"></script>

  <script>
    /* حماية خانة الإجابة من أحداث المشهد والسماح بالكتابة والحذف بشكل طبيعي. */
    const answerWatcher = new MutationObserver(() => {
      const input = document.querySelector('#in');
      if (!input || input.dataset.ready === '1') return;

      input.dataset.ready = '1';
      input.disabled = false;
      input.readOnly = false;
      input.tabIndex = 0;

      ['pointerdown','mousedown','click','touchstart'].forEach(type => {
        input.addEventListener(type, e => e.stopPropagation());
      });

      ['keydown','keyup','keypress','input','beforeinput'].forEach(type => {
        input.addEventListener(type, e => e.stopPropagation());
      });

      requestAnimationFrame(() => input.focus());
    });

    answerWatcher.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
