<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قضية المتحدث الحقيقي</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"></div>

  <script>
    /* كل إعادة تحميل تبدأ القضية من السؤال الأول */
    try { localStorage.removeItem('asc-001'); } catch (e) {}
  </script>

  <script>
    /* نحافظ على الانتقال السريع الموجود في اللعبة */
    (() => {
      const nativeSetTimeout = window.setTimeout;
      window.setTimeout = function (fn, ms, ...args) {
        if (ms === 6000) ms = 3200;
        if (ms === 2400) ms = 300;
        return nativeSetTimeout.call(window, fn, ms, ...args);
      };
    })();
  </script>

  <script type="module" src="./main.js"></script>

  <script>
    /* إصلاح خانة الإجابة فقط — بدون تغيير منطق اللعبة أو الانتقالات */
    const normalizeAnswer = value => String(value || '')
      .replace(/[\u064B-\u065F\u0640]/g, '')
      .replace(/[أإآ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/[^\u0621-\u064Aa-z0-9 ]/gi, '')
      .replace(/\s+/g, ' ')
      .trim();

    const answerAliases = {
      'الخوف': 'الخوف من التحدث',
      'خوف': 'الخوف من التحدث',
      'لغة الجسد': 'لغة الجسد',
      'لغة الجسم': 'لغة الجسد',
      'الخريطة الذهنية': 'الخريطة الذهنية',
      'خريطة ذهنية': 'الخريطة الذهنية',
      'الارتجال': 'الارتجال',
      'ارتجال': 'الارتجال',
      'الوعي بالذات': 'الوعي بالذات',
      'وعي بالذات': 'الوعي بالذات',
      'نبرات الصوت': 'نبرات الصوت',
      'نبرة الصوت': 'نبرات الصوت',
      'فن الوقفات': 'فن الوقفات',
      'الوقفات': 'فن الوقفات'
    };

    const getAnswerInput = () => {
      const input = document.querySelector('#in');
      const puzzle = document.querySelector('#pz');
      return input && puzzle && puzzle.classList.contains('on') ? input : null;
    };

    const prepareAnswerInput = () => {
      const input = getAnswerInput();
      if (!input) return;

      input.disabled = false;
      input.readOnly = false;
      input.tabIndex = 0;
      input.type = 'text';
      input.style.pointerEvents = 'auto';
      input.style.userSelect = 'text';
      input.style.webkitUserSelect = 'text';
      input.style.cursor = 'text';
      input.style.position = 'relative';
      input.style.zIndex = '30';
    };

    const focusAnswerInput = () => {
      const input = getAnswerInput();
      if (!input) return;
      prepareAnswerInput();
      try { input.focus({preventScroll:true}); } catch(e) { input.focus(); }
      const end = input.value.length;
      try { input.setSelectionRange(end, end); } catch(e) {}
    };

    const answerWatcher = new MutationObserver(() => {
      const input = getAnswerInput();
      if (!input) return;
      prepareAnswerInput();
    });
    answerWatcher.observe(document.body, {childList:true, subtree:true});

    document.addEventListener('focusin', e => {
      if (e.target && e.target.id === 'in') prepareAnswerInput();
    }, true);

    /* الضغط على خانة الإجابة يركز عليها فورًا ولا يمر إلى المسرح */
    document.addEventListener('pointerdown', e => {
      const input = e.target && e.target.closest ? e.target.closest('#in') : null;
      if (!input) return;
      e.stopPropagation();
      prepareAnswerInput();
      try { input.focus({preventScroll:true}); } catch(err) { input.focus(); }
    }, true);

    document.addEventListener('mousedown', e => {
      const input = e.target && e.target.closest ? e.target.closest('#in') : null;
      if (!input) return;
      e.stopPropagation();
      prepareAnswerInput();
      try { input.focus({preventScroll:true}); } catch(err) { input.focus(); }
    }, true);

    /* لا نسمح للعبة بالتعامل مع أحداث لوحة المفاتيح قبل خانة الإجابة */
    document.addEventListener('keydown', e => {
      const input = getAnswerInput();
      if (!input) return;

      /* لو الخانة هي العنصر النشط، نترك المتصفح يتعامل معها طبيعيًا */
      if (document.activeElement === input) return;

      if (e.key === 'Enter') return;

      if (e.key === 'Backspace') {
        input.value = input.value.slice(0, -1);
        input.dispatchEvent(new Event('input', {bubbles:true}));
        e.preventDefault();
        focusAnswerInput();
        return;
      }

      if (e.key === 'Delete') {
        input.value = '';
        input.dispatchEvent(new Event('input', {bubbles:true}));
        e.preventDefault();
        focusAnswerInput();
        return;
      }

      if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
        input.value += e.key;
        input.dispatchEvent(new Event('input', {bubbles:true}));
        e.preventDefault();
        focusAnswerInput();
      }
    }, true);

    /* دعم الإدخال العربي من لوحة المفاتيح/IME */
    document.addEventListener('beforeinput', e => {
      const input = getAnswerInput();
      if (!input || document.activeElement === input) return;
      if (typeof e.data !== 'string') return;
      input.value += e.data;
      input.dispatchEvent(new Event('input', {bubbles:true}));
      e.preventDefault();
      focusAnswerInput();
    }, true);

    /* تصحيح الإجابات المختصرة قبل التحقق */
    document.addEventListener('click', e => {
      const button = e.target && e.target.closest ? e.target.closest('#ok') : null;
      if (!button) return;

      const input = document.querySelector('#in');
      if (!input) return;

      const normalized = normalizeAnswer(input.value);
      const key = Object.keys(answerAliases).find(k => normalizeAnswer(k) === normalized);
      if (key) input.value = answerAliases[key];
    }, true);
  </script>

  <script type="module" src="./flow-patch.js"></script>
</body>
</html>
