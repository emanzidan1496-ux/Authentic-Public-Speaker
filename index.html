<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قضية المتحدث الحقيقي</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"></div>

  <script>
    /* كل إعادة تحميل تبدأ القضية من السؤال الأول */
    try { localStorage.removeItem('asc-001'); } catch (e) {}
  </script>

  <script>
    /* نحافظ على الانتقال السريع الموجود في اللعبة */
    (() => {
      const nativeSetTimeout = window.setTimeout;
      window.setTimeout = function (fn, ms, ...args) {
        if (ms === 6000) ms = 3200;
        if (ms === 2400) ms = 300;
        return nativeSetTimeout.call(window, fn, ms, ...args);
      };
    })();
  </script>

  <script>
    /* اختصارات الإجابات فقط — لا نتدخل في الكتابة داخل الخانة */
    const normalizeAnswer = value => String(value || '')
      .replace(/[\u064B-\u065F\u0640]/g, '')
      .replace(/[أإآ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/\s+/g, ' ')
      .trim();

    const answerAliases = {
      'الخوف': 'الخوف من التحدث أمام الجمهور',
      'خوف': 'الخوف من التحدث أمام الجمهور'
    };

    /* يعمل قبل زر التحقق، لكنه لا يلمس أحداث لوحة المفاتيح إطلاقًا */
    document.addEventListener('click', e => {
      const button = e.target && e.target.closest ? e.target.closest('#ok') : null;
      if (!button) return;
      const input = document.querySelector('#in');
      if (!input) return;
      const value = normalizeAnswer(input.value);
      if (answerAliases[value]) input.value = answerAliases[value];
    }, true);
  </script>

  <script type="module" src="./main.js"></script>
  <script type="module" src="./flow-patch.js"></script>
</body>
</html>
