<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قضية المتحدث الحقيقي</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"></div>

  <script>
    /* يبدأ التحقيق من البداية عند كل Refresh. */
    try { localStorage.removeItem('asc-001'); } catch (e) {}
  </script>

  <script type="module" src="./main.js"></script>

  <script>
    /* إصلاح خانة الإجابة: نستبدل حقل الإدخال بحقل نصي مستقل وقابل للكتابة فعليًا. */
    const answerWatcher = new MutationObserver(() => {
      const old = document.querySelector('#in');
      if (!old || old.dataset.ready === '1') return;

      const input = document.createElement('textarea');
      input.id = 'in';
      input.rows = 1;
      input.value = old.value || '';
      input.placeholder = old.placeholder || 'اكتب إجابتك';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.dataset.ready = '1';
      input.setAttribute('dir', 'rtl');
      input.style.cssText = 'flex:1;min-height:48px;resize:none;padding:.5em;font:inherit;font-size:1.2em;background:#fff;color:#2F2E2B;border:1px solid #A66F4E;pointer-events:auto!important;user-select:text!important;-webkit-user-select:text!important;cursor:text!important;position:relative;z-index:99999;display:block;';

      old.replaceWith(input);

      ['pointerdown','mousedown','click','touchstart'].forEach(type => {
        input.addEventListener(type, e => e.stopPropagation());
      });

      requestAnimationFrame(() => {
        input.focus();
        try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
      });
    });

    answerWatcher.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
