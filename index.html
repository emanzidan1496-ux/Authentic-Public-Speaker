<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قضية المتحدث الحقيقي</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"></div>

  <script>
    /* كل إعادة تحميل تبدأ القضية من السؤال الأول */
    try { localStorage.removeItem('asc-001'); } catch (e) {}
  </script>

  <script type="module" src="./main.js"></script>

  <script>
    /* إصلاح الكتابة بشكل مباشر: نخلي خانة الإجابة هي العنصر المسيطر على لوحة المفاتيح */
    const answerWatcher = new MutationObserver(() => {
      const input = document.querySelector('#in');
      const puzzle = document.querySelector('#pz');
      if (!input || !puzzle || input.dataset.ready === '1') return;

      input.dataset.ready = '1';
      input.disabled = false;
      input.readOnly = false;
      input.tabIndex = 0;
      input.style.pointerEvents = 'auto';
      input.style.position = 'relative';
      input.style.zIndex = '30';

      ['pointerdown','mousedown','mouseup','click','touchstart','touchend'].forEach(type => {
        input.addEventListener(type, e => e.stopPropagation());
      });

      requestAnimationFrame(() => {
        input.focus({preventScroll:true});
      });
    });

    answerWatcher.observe(document.body, {childList:true, subtree:true});

    /* احتياطي للوحة المفاتيح: حتى لو فقدت الخانة التركيز، الكتابة تذهب إليها */
    document.addEventListener('keydown', e => {
      const input = document.querySelector('#in');
      const puzzle = document.querySelector('#pz');
      if (!input || !puzzle || !puzzle.classList.contains('on')) return;

      if (e.key === 'Backspace') {
        if (document.activeElement !== input) {
          input.value = input.value.slice(0, -1);
          e.preventDefault();
        }
        return;
      }

      if (e.key === 'Delete') {
        if (document.activeElement !== input) {
          input.value = '';
          e.preventDefault();
        }
        return;
      }

      if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
        if (document.activeElement !== input) {
          input.value += e.key;
          e.preventDefault();
        }
      }
    }, true);
  </script>
</body>
</html>
